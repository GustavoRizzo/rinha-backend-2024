# Override que REMOVE as restrições de CPU e memória.
#
# Fora do regulamento de propósito: serve para responder "quanto a aplicação
# entrega quando a cota não é o gargalo?" — e, por diferença, quanto a cota está
# custando. Não use para nada que vá comparar com a competição.
#
# Aqui ele tem um papel extra: é o único rig em que `SCHEDULERS=auto` é a
# configuração NATURAL, e não uma armadilha. Comparar `auto` sem cota contra
# `auto` com cota isola exatamente o efeito do cgroup sobre o dimensionamento
# da BEAM.
services:
  db:
    deploy: !reset null
  api01:
    deploy: !reset null
  nginx:
    deploy: !reset null
