# nginx como load balancer da Rinha.
#
# Duas decisões que valem mais que qualquer tuning aqui:
#
# 1. O salto nginx->API usa SOCKET DE DOMÍNIO UNIX, não TCP. O worker sync do
#    gunicorn fecha toda conexão (sync.py:177), então cada requisição repassada
#    abriria um TCP novo — e a ~470 conexões/s a faixa de portas efêmeras do
#    host esgota (ver 04-aprendizados.md). Socket Unix não tem porta nem
#    TIME_WAIT: a classe inteira do problema deixa de existir.
#
# 2. `access_log off`. Log por requisição é I/O síncrono no caminho quente — o
#    experimento 01 mediu esse custo no runserver.

worker_processes 1;          # sob cota de CPU, mais workers só queimam a cota mais rápido

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;

    # Mantém a conexão viva com o CLIENTE (o gerador de carga). É o lado que o
    # nginx consegue resolver — o lado do backend depende do tipo de worker.
    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream api {
        server unix:/sockets/api01.sock;
        # Sem efeito enquanto o backend for o worker sync, que faz force_close.
        # Fica declarado porque passa a valer assim que trocarmos de worker.
        keepalive 64;
    }

    server {
        listen 9999 backlog=4096;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
