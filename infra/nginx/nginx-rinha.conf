# nginx da stack completa: round-robin entre DUAS instâncias de API.
#
# Decisões herdadas dos experimentos anteriores, com o número que as sustenta:
#   - socket Unix no salto para as APIs (exp. 03: 2,9x em vazão alta, e a
#     amplitude cai de 246% para 3,9%)
#   - access_log off (exp. 01: log por request é I/O no caminho quente)
#   - worker_processes 1 (exp. 02: sob cota, mais paralelismo custa CPU/request)

worker_processes 1;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream api {
        # Round-robin é o padrão do nginx e o que a competição exige.
        server unix:/sockets/api01.sock;
        server unix:/sockets/api02.sock;
        keepalive 64;
    }

    server {
        listen 9999 backlog=4096;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
