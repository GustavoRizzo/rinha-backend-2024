# Variante idêntica ao nginx.conf, exceto pelo upstream: TCP em vez de socket
# Unix. Existe só para medir quanto o socket Unix vale — é a única linha que
# muda entre as duas configurações.
worker_processes 1;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream api {
        server api01:8080;      # <-- a única diferença
        keepalive 64;
    }

    server {
        listen 9999 backlog=4096;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
