# Postgres com pg_stat_statements ligado, SÓ para diagnóstico.
#
# Não substitui `postgresql.conf` — ele o INCLUI. Duplicar os parâmetros aqui
# criaria dois arquivos que divergem com o tempo, e o diagnóstico passaria a
# medir uma configuração que nenhuma stack usa.
#
# NUNCA use este arquivo numa série de bancada nem na prova oficial:
# `pg_stat_statements` tem custo próprio, e um número medido com ele ligado não
# é comparável com os que já estão em `resultados/`.
include = '/etc/postgresql/postgresql.conf'

shared_preload_libraries = 'pg_stat_statements'

# `track_planning` é o parâmetro que este diagnóstico existe para ler: sem ele,
# a coluna `plans` fica zerada e a pergunta "o statement está sendo replanejado
# a cada requisição?" não tem resposta. Vem DESLIGADO por padrão desde o PG 13,
# justamente por ter custo.
pg_stat_statements.track_planning = on
pg_stat_statements.track = all
pg_stat_statements.max = 1000
