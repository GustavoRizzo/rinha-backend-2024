# Postgres sob as restrições da Rinha.
#
# O gargalo aqui não é disco nem CPU do banco: é MEMÓRIA. Cada conexão no
# Postgres é um PROCESSO do sistema operacional, com ~5-10MB de overhead. Num
# orçamento de 550MB somando todos os serviços, o número de conexões é uma
# decisão de arquitetura, não um detalhe.

listen_addresses = '*'

# Poucos clientes conectam, e cada um mantém a conexão viva (CONN_MAX_AGE).
# 2 APIs x poucos workers + folga para manutenção.
max_connections = 20

# Cache de páginas do próprio Postgres. Regra usual é 25% da RAM disponível.
shared_buffers = 64MB
effective_cache_size = 128MB

# Memória por operação de ordenação/hash. Multiplica por conexão — cuidado.
work_mem = 4MB
maintenance_work_mem = 32MB

# ---------------------------------------------------------------------------
# Durabilidade: a decisão mais controversa deste arquivo.
#
# Com synchronous_commit = off o Postgres confirma o COMMIT antes de o WAL
# chegar ao disco. Ganho grande em vazão de escrita; em troca, um crash do
# SERVIDOR pode perder os últimos milissegundos de transações confirmadas.
#
# Aceitável aqui porque é um exercício de 4 minutos. INACEITÁVEL num sistema
# real de pagamentos — é exatamente o tipo de troca que a Rinha incentiva e que
# não deve ser copiada para produção.
# ---------------------------------------------------------------------------
synchronous_commit = off

# Não desligamos fsync: com fsync=off um crash corrompe o banco, e não é só
# perda de dados recentes.
fsync = on
full_page_writes = on

wal_buffers = 4MB
checkpoint_completion_target = 0.9
min_wal_size = 32MB
max_wal_size = 256MB

# Sem log por consulta: I/O no caminho quente, como o access_log do nginx.
log_min_duration_statement = -1
logging_collector = off

autovacuum = on
