# Override que REMOVE as restrições de CPU e memória.
#
# Fora do regulamento de propósito: serve para responder "quanto a aplicação
# entrega quando a cota não é o gargalo?" — e, por diferença, quanto a cota está
# custando. Não use para nada que vá comparar com a competição.
#
# Aqui ele tem um papel extra e específico do Go: é o único rig em que
# `GOMAXPROCS=auto` significa "os 20 núcleos da máquina". Sob cota, `auto` são
# 2 threads por causa do piso do runtime
# (`performance/go/00-indice.md`, seção 7.1); sem cota, são 20. Comparar os dois
# isola o efeito do cgroup sobre o dimensionamento do scheduler.
services:
  db:
    deploy: !reset null
  api01:
    deploy: !reset null
  nginx:
    deploy: !reset null
