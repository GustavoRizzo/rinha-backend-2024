# Nome de projeto PRÓPRIO, distinto do da stack de produção: com o mesmo
# nome, o Compose trata os dois como o mesmo projeto e tenta reconciliar —
# um container remanescente da stack real bloqueia a subida do rig.
name: rinha-backend-django-bench

# Rig do experimento 04: nginx + UMA API + Postgres.
#
# Quarto degrau. Muda uma coisa em relação ao experimento 03: o banco. Mesma
# API, mesmo nginx, mesmo socket Unix — para que a diferença seja atribuível ao
# Postgres e a mais nada.
services:
  db:
    image: postgres:18-alpine
    container_name: rinha-bench-db
    environment:
      - POSTGRES_DB=rinha
      - POSTGRES_USER=rinha
      - POSTGRES_PASSWORD=rinha
    volumes:
      - ../infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      # -h 127.0.0.1 de propósito: durante a inicialização a imagem sobe um
      # servidor TEMPORÁRIO que escuta APENAS no socket Unix. Sem o -h, o
      # healthcheck aprova esse servidor provisório e a API tenta conectar
      # bem na hora em que ele é derrubado.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rinha -d rinha"]
      interval: 2s
      timeout: 2s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-0.6}"
          memory: "${DB_MEM:-200MB}"

  api01:
    build:
      context: .
    container_name: rinha-bench-api01
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_DEBUG=0
      - BENCH_SEED=1
      - WEB_CONCURRENCY=${API_WORKERS:-1}
      - GUNICORN_BIND=unix:/sockets/api01.sock
      - DB_HOST=db
      - DB_PERSISTENTE=${DB_PERSISTENTE:-1}
      - DB_POOL=${DB_POOL:-0}
      # Variantes de `performance/django/07`. Os padrões preservam o
      # comportamento com que todas as séries anteriores foram medidas.
      - DB_PREPARED=${DB_PREPARED:-0}
      - DB_HEALTH_CHECKS=${DB_HEALTH_CHECKS:-1}
      - WEB_SERVER=${API_SERVER:-gunicorn-sync}
      - WEB_THREADS=${API_THREADS:-4}
      # Experimento 08: views `async def` + pool assíncrono do psycopg.
      - VIEWS_ASYNC=${VIEWS_ASYNC:-0}
      - DB_POOL_MAX=${DB_POOL_MAX:-8}
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.45}"
          memory: "${API_MEM:-150MB}"

  nginx:
    image: nginx:1.29-alpine
    container_name: rinha-bench-nginx
    depends_on:
      - api01
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "${LB_PORTA:-9999}:9999"
    deploy:
      resources:
        limits:
          cpus: "${LB_CPUS:-0.15}"
          memory: "${LB_MEM:-32MB}"

volumes:
  sockets:

networks:
  default:
    name: rinha-bench
